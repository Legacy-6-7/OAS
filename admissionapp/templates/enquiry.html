<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enquiry Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet: #6d5bf6;
            --violet-dark: #5340e0;
            --cyan: #22d3ee;
            --ink: #1a1730;
            --muted: #7b7594;
        }

        * {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: #080614;
            background-image: 
                /* Grid Pattern Layer */
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                /* Ambient Glow Orbs */
                radial-gradient(circle at 15% 20%, rgba(109, 91, 246, 0.35), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(34, 211, 238, 0.25), transparent 45%),
                linear-gradient(135deg, #080614 0%, #100c26 50%, #18113b 100%);
            background-size: 48px 48px, 48px 48px, 100% 100%, 100% 100%, 100% 100%;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle glowing backdrop highlight element */
        body::before {
            content: '';
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(ellipse at center, rgba(109, 91, 246, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        .enquiry-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 16px 70px;
            position: relative;
            z-index: 1;
        }

        .enquiry-wrap {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .enquiry-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 50px;
            color: var(--cyan);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0 auto 16px;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.1);
        }

        .enquiry-heading-wrapper {
            text-align: center;
        }

        .enquiry-heading {
            text-align: center;
            color: #fff;
            font-weight: 800;
            font-size: 34px;
            letter-spacing: -.03em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .enquiry-subhead {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            max-width: 460px;
            margin: 0 auto 36px;
            line-height: 1.5;
        }

        .enquiry-card {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 70px rgba(4, 2, 20, 0.5), 
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            overflow: hidden;
            position: relative;
        }

        /* Decorative top gradient accent bar on the card */
        .enquiry-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--violet), var(--cyan));
        }

        .enquiry-card .card-body {
            padding: 44px 40px 38px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 15px;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        /* Highlight icon dynamically when input/select is focused */
        .input-icon:focus-within i {
            color: var(--violet);
        }

        .input-icon .form-control,
        .input-icon .form-select {
            padding-left: 46px;
        }

        .form-control,
        .form-select {
            height: 52px;
            border-radius: 14px;
            border: 1.5px solid #e2def5;
            background: #fcfbfe;
            font-size: 15px;
            color: var(--ink);
            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: #9f9bb8;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(109, 91, 246, 0.12);
            background: #fff;
        }

        textarea.form-control {
            height: 120px;
            resize: none;
            padding-top: 14px;
        }

        .btn-submit {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: .01em;
            color: #fff;
            background: linear-gradient(135deg, var(--violet) 0%, var(--violet-dark) 100%);
            box-shadow: 0 10px 25px rgba(83, 64, 224, 0.4);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(83, 64, 224, 0.55);
            background: linear-gradient(135deg, var(--violet-dark) 0%, #442fc7 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit i {
            transition: transform 0.2s ease;
        }

        .btn-submit:hover i {
            transform: translateX(4px);
        }

        @media (max-width: 480px) {
            .enquiry-card .card-body {
                padding: 32px 24px 28px;
            }

            .enquiry-heading {
                font-size: 26px;
            }

            .enquiry-subhead {
                font-size: 14px;
                margin-bottom: 28px;
            }
        }
    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <div class="enquiry-section">
        <div class="enquiry-wrap">

            <div class="enquiry-heading-wrapper">
                <span class="enquiry-eyebrow">
                    <i class="fa-solid fa-sparkles"></i> Get In Touch
                </span>
                <h1 class="enquiry-heading">Student Enquiry Form</h1>
                <p class="enquiry-subhead">Tell us a bit about yourself and the course you're interested in — we'll get back to you shortly.</p>
            </div>

            <div class="card enquiry-card">
                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-user"></i>
                                <input type="text" class="form-control" placeholder="Enter your name" name="name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-phone"></i>
                                <input type="tel" class="form-control" placeholder="Enter mobile number" name="mobile" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-graduation-cap"></i>
                                <select class="form-select" name="course" required>
                                    <option value="">Select a course</option>
                                    {% for course in courses %}
                                        <option value="{{ course.coursename }}">{{ course.coursename }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" placeholder="Write your enquiry..." name="message"></textarea>
                        </div>

                        <button type="submit" class="btn-submit">
                            Submit Enquiry <i class="fa-solid fa-arrow-right"></i>
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

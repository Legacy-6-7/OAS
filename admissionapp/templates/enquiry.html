<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enquiry Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --violet: #6d5bf6;
            --violet-dark: #5340e0;
            --cyan: #22d3ee;
            --ink: #1a1730;
            --muted: #7b7594;
        }

        * {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 12% 15%, rgba(109, 91, 246, .35), transparent 45%),
                radial-gradient(circle at 88% 85%, rgba(34, 211, 238, .25), transparent 45%),
                linear-gradient(135deg, #0a0818 0%, #120e2b 45%, #1c1440 100%);
        }

        .enquiry-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 16px;
        }

        .enquiry-wrap {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .enquiry-eyebrow {
            display: block;
            text-align: center;
            color: var(--cyan);
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: .16em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .enquiry-heading {
            text-align: center;
            color: #fff;
            font-weight: 800;
            font-size: 30px;
            letter-spacing: -.02em;
            margin-bottom: 8px;
        }

        .enquiry-subhead {
            text-align: center;
            color: rgba(255, 255, 255, .55);
            font-size: 14.5px;
            max-width: 420px;
            margin: 0 auto 32px;
        }

        .enquiry-card {
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 22px;
            background: rgba(255, 255, 255, .97);
            box-shadow: 0 25px 60px rgba(5, 2, 25, .45);
            overflow: hidden;
        }

        .enquiry-card .card-body {
            padding: 40px 38px 34px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--ink);
            margin-bottom: 7px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
        }

        .input-icon .form-control,
        .input-icon .form-select {
            padding-left: 42px;
        }

        .form-control,
        .form-select {
            height: 50px;
            border-radius: 12px;
            border: 1.5px solid #e7e5f4;
            background: #faf9ff;
            font-size: 14.5px;
            color: var(--ink);
            transition: .2s;
        }

        .form-control::placeholder {
            color: #a8a4bf;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(109, 91, 246, .15);
            background: #fff;
        }

        textarea.form-control {
            height: 120px;
            resize: none;
            padding-top: 14px;
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15.5px;
            letter-spacing: .01em;
            color: #fff;
            background: linear-gradient(120deg, var(--violet) 0%, var(--violet-dark) 100%);
            box-shadow: 0 10px 24px rgba(83, 64, 224, .35);
            transition: .2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(83, 64, 224, .45);
            background: linear-gradient(120deg, var(--violet-dark) 0%, #442fc7 100%);
        }

        .btn-submit i {
            margin-left: 6px;
        }

        @media (max-width: 480px) {
            .enquiry-card .card-body {
                padding: 30px 22px 26px;
            }

            .enquiry-heading {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    {% include 'navbar.html' %}

    <div class="enquiry-section">
    <div class="enquiry-wrap">

        <span class="enquiry-eyebrow">Get In Touch</span>
        <h1 class="enquiry-heading">Student Enquiry Form</h1>
        <p class="enquiry-subhead">Tell us a bit about yourself and the course you're interested in — we'll get back to you shortly.</p>

        <div class="card enquiry-card">
            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" class="form-control" placeholder="Enter your name" name="name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" class="form-control" placeholder="Enter mobile number" name="mobile" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <select class="form-select" name="course" required>
                                <option selected disabled value="">Select Course</option>
                                <option value="Java">Java</option>
                                <option value="C++">C++</option>
                                <option value="Python">Python</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="HTML">Full Stack Web Development</option>
                                <option value="Data Structures">Data Structures</option>
                                <option value="Machine Learning">Machine Learning</option>
                                <option value="Artificial Intelligence">Artificial Intelligence</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" placeholder="Write your enquiry..." name="message"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        Submit Enquiry <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

            </div>
        </div>

    </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

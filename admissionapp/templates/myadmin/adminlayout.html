{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipher Web | Admin</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'admissionapp/style.css' %}">

    <style>
        :root {
            --side-bg: #0A0330;
            --side-bg-mid: #150864;
            --side-border: rgba(255, 255, 255, .08);
            --side-ink: #F2F4FA;
            --side-ink-muted: rgba(242, 244, 250, .62);
            --accent-gold: #FFE401;
            --accent-gold-soft: rgba(255, 228, 1, .14);
            --accent-navy: #100563;
            --content-bg: #F4F5FB;
        }

        * { font-family: 'Poppins', system-ui, sans-serif; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--content-bg);
            overflow: hidden;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 228, 1, .06), transparent 50%),
                linear-gradient(180deg, var(--side-bg) 0%, var(--side-bg-mid) 55%, var(--accent-navy) 100%);
            transition: margin-left .3s ease;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--side-border);
        }

        .sidebar.hide {
            margin-left: -260px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 18px;
            border-bottom: 1px solid var(--side-border);
            flex-shrink: 0;
        }

        .sidebar-brand .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
            flex-shrink: 0;
        }

        .sidebar-brand .brand-mark img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .sidebar-brand h3 {
            color: var(--side-ink);
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: .02em;
            line-height: 1.2;
        }

        .sidebar-brand h3 span {
            display: block;
            font-size: .7rem;
            font-weight: 500;
            color: var(--side-ink-muted);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .sidebar-nav {
            padding: 14px 12px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-nav .nav-label {
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--side-ink-muted);
            padding: 8px 12px 10px;
            margin: 0;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--side-ink-muted);
            text-decoration: none;
            padding: 12px 14px;
            font-size: .9rem;
            font-weight: 500;
            border-radius: 12px;
            margin-bottom: 3px;
            transition: background .2s ease, color .2s ease;
        }

        .sidebar a i {
            width: 22px;
            text-align: center;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, .08);
            color: var(--side-ink);
            text-decoration: none;
        }

        .sidebar a.active {
            background: var(--accent-gold-soft);
            color: var(--accent-gold);
            text-decoration: none;
            box-shadow: inset 3px 0 0 var(--accent-gold);
        }

        .sidebar a.active i {
            color: var(--accent-gold) !important;
        }

        .sidebar-footer {
            padding: 14px 16px 18px;
            border-top: 1px solid var(--side-border);
            flex-shrink: 0;
        }

        .sidebar-footer .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--side-border);
        }

        .sidebar-footer .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #F2CE00);
            color: var(--accent-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            flex-shrink: 0;
        }

        .sidebar-footer .user-meta strong {
            display: block;
            color: var(--side-ink);
            font-size: .85rem;
            font-weight: 600;
        }

        .sidebar-footer .user-meta small {
            color: var(--side-ink-muted);
            font-size: .72rem;
        }

        /* ---------- Main content ---------- */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }

        /* Topbar — same navy as sidebar */
        .topbar {
            height: 64px;
            flex-shrink: 0;
            background:
                radial-gradient(circle at 90% 50%, rgba(255, 228, 1, .05), transparent 45%),
                linear-gradient(90deg, var(--side-bg) 0%, var(--side-bg-mid) 50%, var(--accent-navy) 100%);
            border-bottom: 1px solid var(--side-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
            padding: 0 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .14);
            background: rgba(255, 255, 255, .07);
            color: var(--side-ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .2s ease, border-color .2s ease;
            cursor: pointer;
        }

        .topbar .menu-btn:hover {
            background: rgba(255, 255, 255, .12);
            border-color: rgba(255, 255, 255, .22);
            color: var(--side-ink);
        }

        .topbar .page-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--side-ink);
            margin: 0;
        }

        .topbar .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-gold), #F2CE00);
            border: none;
            color: var(--accent-navy);
            font-weight: 700;
            font-size: .875rem;
            padding: 8px 18px;
            border-radius: 999px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 228, 1, .28);
            transition: box-shadow .2s ease, background .2s ease;
        }

        .topbar .logout-btn:hover {
            background: linear-gradient(135deg, #FFEC4D, var(--accent-gold));
            box-shadow: 0 6px 16px rgba(255, 228, 1, .4);
            color: var(--accent-navy);
        }

        .page-content {
            flex: 1;
            overflow: auto;
            padding: 24px;
            background: var(--content-bg);
        }

        .page-content::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .page-content::-webkit-scrollbar-track {
            background: #E8EAF2;
        }

        .page-content::-webkit-scrollbar-thumb {
            background: #100563;
            border-radius: 8px;
        }

        .page-content::-webkit-scrollbar-thumb:hover {
            background: #150864;
        }

        .page-content {
            scrollbar-width: thin;
            scrollbar-color: #100563 #E8EAF2;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 200;
                height: 100vh;
            }
            .page-content {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="d-flex" style="height: 100vh;">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-mark">
                <img src="{% static 'admissionapp/SipherWebLogo.png' %}" alt="SW">
            </div>
            <h3>
                Sipher Web
                <span>Admin Panel</span>
            </h3>
        </div>

        <nav class="sidebar-nav">
            <p class="nav-label">Menu</p>

            <a href="{% url 'dashboard' %}">
                <i class="fa-solid fa-chart-line" style="color:#74c0fc;"></i>
                <span>Dashboard</span>
            </a>

            <a href="{% url 'add' %}">
                <i class="fa-solid fa-user-plus" style="color:#ffd43b;"></i>
                <span>Add Students</span>
            </a>

            <a href="{% url 'allstudents' %}">
                <i class="fa-solid fa-user-pen" style="color:#63e6be;"></i>
                <span>All Students</span>
            </a>

            <a href="{% url 'adminapplication' %}">
                <i class="fa-solid fa-file-lines" style="color:#8ce99a;"></i>
                <span>Applications</span>
            </a>

            <a href="{% url 'admincourses' %}">
                <i class="fa-solid fa-book-bookmark" style="color:#5c7cfa;"></i>
                <span>Add Courses</span>
            </a>

            <a href="{% url 'fee_status' %}">
                <i class="fa-solid fa-calendar-check" style="color:#ff922b;"></i>
                <span>Fee Submission</span>
            </a>

            <a href="{% url 'adminenquiry' %}">
                <i class="fa-solid fa-envelope" style="color:#66d9e8;"></i>
                <span>Enquiries</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="user-avatar">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="user-meta">
                    <strong>Admin</strong>
                    <small>Full access</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <header class="topbar">
            <button type="button" class="menu-btn" id="menuBtn" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="page-title d-none d-sm-block">Admin Panel</h1>
            <div class="ms-auto">
                <a href="{% url 'home' %}" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </div>
        </header>

        <div class="page-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");

    menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("hide");
    });

    const currentPath = window.location.pathname;
    document.querySelectorAll("#sidebar a").forEach(link => {
        const linkPath = new URL(link.href, window.location.origin).pathname;
        if (currentPath === linkPath) {
            link.classList.add("active");
        }
    });
</script>

</body>
</html>

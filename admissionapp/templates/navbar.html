{% load static %}

<style>
    :root {
        --nav-ink: #F2F4FA;
        --nav-ink-muted: rgba(242, 244, 250, .68);
        --nav-accent-gold: #FFE401;
        --nav-accent-gold-soft: rgba(255, 228, 1, .12);
        --nav-accent-navy: #100563;
        --nav-accent-blue: #8EA0F0;
        --nav-accent-blue-soft: rgba(142, 160, 240, .14);
        --nav-glass-bg: rgba(255, 255, 255, .07);
        --nav-glass-bg-strong: rgba(255, 255, 255, .11);
        --nav-glass-border: rgba(255, 255, 255, .14);
    }

    /* =========================
       NAVBAR CONTAINER
    ========================== */

    .navbar-wrap {
        display: inline-flex;          /* key for centering */
        width: auto;
        max-width: 1300px;
        margin: 20px auto 0;           /* horizontal auto centers it */
        padding: 20px 100px !important;

        border: 1px solid var(--nav-glass-border);
        border-radius: 50px;

        background: linear-gradient(
            135deg,
            rgba(255,255,255,0.10),
            rgba(255,255,255,0.04)
        ), rgba(9, 7, 26, 0.62);

        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);

        box-shadow:
            0 12px 35px rgba(0,0,0,0.30),
            inset 0 1px 0 rgba(255,255,255,0.08);

        transition: all .3s ease;
    }

    .navbar-wrap:hover {
        border-color: rgba(255,228,1,0.24);
        box-shadow:
            0 15px 40px rgba(0,0,0,0.35),
            0 0 25px rgba(255,228,1,0.06);
    }

    /* Outer wrapper that centers the pill */
    .navbar-outer {
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .custom-navbar {
        padding: 0 !important;
        width: 100%;
    }

    .navbar-nav {
        width: auto;
        white-space: nowrap;
        align-items: center;
        gap: 2px;
    }

    /* =========================
       LOGO
    ========================== */

    .logo-plate {
        background: transparent;
        padding: 0;
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-plate .logo {
        display: block;
        width: 82px;
        height: 42px;
        object-fit: contain;
        transition: transform .25s ease;
    }

    .logo-plate:hover .logo {
        transform: scale(1.04);
    }

    /* =========================
       NAV LINKS
    ========================== */

    .navbar-nav .nav-link {
        position: relative;
        color: var(--nav-ink-muted) !important;
        font-size: 14px;
        font-weight: 600;
        margin: 0 1px;
        padding: 7px 12px !important;
        border-radius: 30px;
        transition:
            color .2s ease,
            background .2s ease,
            transform .2s ease;
    }

    .navbar-nav .nav-link:hover {
        color: var(--nav-ink) !important;
        background: var(--nav-accent-blue-soft);
        transform: translateY(-1px);
    }

    .navbar-nav .nav-link.active {
        color: var(--nav-ink) !important;
        background: var(--nav-accent-gold-soft);
    }

    .navbar-nav .nav-link::after {
        content: "";
        position: absolute;
        left: 13px;
        right: 13px;
        bottom: 2px;
        height: 2px;
        background: var(--nav-accent-gold);
        border-radius: 10px;
        transform: scaleX(0);
        transform-origin: center;
        transition: transform .25s ease;
    }

    .navbar-nav .nav-link:hover::after,
    .navbar-nav .nav-link.active::after {
        transform: scaleX(1);
    }

    /* =========================
       LOGIN BUTTON
    ========================== */

    .nav-login-btn {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-left: 6px !important;
        padding: 7px 15px !important;
        color: #fff !important;
        background: linear-gradient(135deg, var(--nav-accent-navy), #2A1690);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 30px;
        font-size: 14px !important;
        font-weight: 700 !important;
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            0 5px 15px rgba(16, 5, 99, 0.35);
        transition:
            background .25s ease,
            transform .2s ease,
            box-shadow .25s ease;
    }

    .nav-login-btn:hover {
        color: #fff !important;
        background: linear-gradient(135deg, #1a0a7a, #3218a8);
        transform: translateY(-1px);
        box-shadow:
            0 7px 18px rgba(16, 5, 99, 0.45),
            0 0 15px rgba(255,228,1,0.10);
    }

    .nav-login-btn::after {
        display: none !important;
    }

    .nav-login-btn i {
        font-size: 14px;
        color: var(--nav-accent-gold);
    }

    /* =========================
       TOGGLER
    ========================== */

    .navbar-toggler {
        border: 1px solid var(--nav-glass-border) !important;
        border-radius: 12px !important;
        padding: 6px 10px !important;
        background: var(--nav-glass-bg);
    }

    .navbar-toggler:focus {
        box-shadow: 0 0 0 0.15rem rgba(255,228,1,0.25) !important;
    }

    .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(242, 244, 250, 0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 991px) {
        .navbar-wrap {
            margin-top: 14px;
            padding: 6px 10px !important;
            border-radius: 40px;
        }

        .logo-plate .logo {
            width: 70px;
            height: 36px;
        }

        .navbar-nav .nav-link {
            font-size: 13px;
            padding: 6px 10px !important;
        }

        .nav-login-btn {
            padding: 6px 12px !important;
            font-size: 13px !important;
        }
    }

    /* =========================
       PHONES
    ========================== */

    @media (max-width: 767px) {
        .navbar-outer {
            padding: 0 12px;
        }

        .navbar-wrap {
            width: 100%;
            max-width: none;
            margin: 12px 0 0;
            padding: 8px 12px !important;
            border-radius: 20px;
            display: block;               /* switch from inline-flex */
        }

        .navbar-brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .logo-plate {
            margin-right: 0;
        }

        .logo-plate .logo {
            width: 68px;
            height: 34px;
        }

        .navbar-collapse {
            width: 100%;
            margin-top: 10px;
        }

        .navbar-nav {
            width: 100%;
            flex-direction: column;
            align-items: stretch;
            white-space: normal;
            gap: 4px;
            padding: 6px 0 4px;
        }

        .navbar-nav .nav-item {
            width: 100%;
        }

        .navbar-nav .nav-link {
            display: block;
            width: 100%;
            text-align: left;
            font-size: 15px;
            padding: 11px 16px !important;
            margin: 0;
            border-radius: 14px;
        }

        .navbar-nav .nav-link::after {
            left: 16px;
            right: auto;
            width: 28px;
            bottom: 8px;
        }

        .nav-login-btn {
            width: 100%;
            justify-content: center;
            margin: 6px 0 0 !important;
            padding: 12px 16px !important;
            font-size: 15px !important;
            border-radius: 14px;
        }
    }

    @media (max-width: 400px) {
        .navbar-outer {
            padding: 0 8px;
        }

        .navbar-wrap {
            margin-top: 10px;
            padding: 6px 10px !important;
        }

        .logo-plate .logo {
            width: 60px;
            height: 30px;
        }
    }
</style>

{% load static %}

<style>
    :root {
        --nav-bg: rgba(20, 15, 45, 0.72);
        --nav-border: rgba(255, 255, 255, 0.12);
        --nav-ink: #F5F5FA;
        --nav-ink-muted: rgba(245, 245, 250, 0.68);
        --nav-accent: #FFE401;
        --nav-purple: #1a0a4a;
    }

    /* =========================
       NAVBAR CONTAINER
    ========================== */

    .navbar-wrap {
        display: inline-flex;
        width: auto;
        height:80px;
        max-width: 1300px;
        margin-top: 20px;

        padding: 6px 10px !important;

        border: 1px solid var(--nav-border);
        border-radius: 50px;

        background: linear-gradient(
            135deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);

        box-shadow:
            0 12px 35px rgba(0,0,0,0.30),
            inset 0 1px 0 rgba(255,255,255,0.08);

        transition: all .3s ease;
    }

    .navbar-wrap:hover {
        border-color: rgba(255,228,1,0.22);

        box-shadow:
            0 15px 40px rgba(0,0,0,0.35),
            0 0 25px rgba(255,228,1,0.04);
    }

    .custom-navbar {
        padding: 0 !important;
    }

    .navbar-collapse {
        flex-grow: 0;
    }

    .navbar-nav {
        width: auto;
        white-space: nowrap;
        align-items: center;
        gap: 2px;
    }


    /* =========================
       LOGO
    ========================== */

    .logo-plate {
        background: transparent;
        padding: 0;
        margin-right: 12px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-plate .logo {
        display: block;

        width: 82px;
        height: 42px;

        object-fit: contain;

        transition: transform .25s ease;
    }

    .logo-plate:hover .logo {
        transform: scale(1.04);
    }


    /* =========================
       NAV LINKS
    ========================== */

    .navbar-nav .nav-link {
        position: relative;

        color: var(--nav-ink-muted) !important;

        font-size: 14px;
        font-weight: 600;

        margin: 0 1px;
        padding: 7px 12px !important;

        border-radius: 30px;

        transition:
            color .2s ease,
            background .2s ease,
            transform .2s ease;
    }

    .navbar-nav .nav-link:hover {
        color: var(--nav-ink) !important;

        background: rgba(255,255,255,0.07);

        transform: translateY(-1px);
    }


    /* =========================
       ACTIVE LINK
    ========================== */

    .navbar-nav .nav-link.active {
        color: var(--nav-ink) !important;

        background: rgba(255,228,1,0.10);
    }

    .navbar-nav .nav-link::after {
        content: "";

        position: absolute;

        left: 13px;
        right: 13px;
        bottom: 2px;

        height: 2px;

        background: var(--nav-accent);

        border-radius: 10px;

        transform: scaleX(0);
        transform-origin: center;

        transition: transform .25s ease;
    }

    .navbar-nav .nav-link:hover::after,
    .navbar-nav .nav-link.active::after {
        transform: scaleX(1);
    }


    /* =========================
       LOGIN BUTTON
    ========================== */

    .nav-login-btn {
        display: inline-flex !important;

        align-items: center;
        justify-content: center;

        gap: 7px;

        margin-left: 6px !important;

        padding: 7px 15px !important;

        color: #F5F5FA !important;

        background: linear-gradient(
            135deg,
            #1a0a4a,
            #29127a
        );

        border: 1px solid rgba(255,255,255,0.14);

        border-radius: 30px;

        font-size: 14px !important;
        font-weight: 700 !important;

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            0 5px 15px rgba(0,0,0,0.18);

        transition:
            background .25s ease,
            transform .2s ease,
            box-shadow .25s ease;
    }

    .nav-login-btn:hover {
        color: #fff !important;

        background: linear-gradient(
            135deg,
            #29127a,
            #3920a0
        );

        transform: translateY(-1px);

        box-shadow:
            0 7px 18px rgba(0,0,0,0.25),
            0 0 15px rgba(255,228,1,0.08);
    }

    .nav-login-btn::after {
        display: none !important;
    }

    .nav-login-btn i {
        font-size: 14px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 991px) {

        .navbar-wrap {
            margin-top: 14px;
            padding: 6px 8px !important;
        }

        .logo-plate {
            margin-right: 7px;
        }

        .logo-plate .logo {
            width: 70px;
            height: 36px;
        }

        .navbar-nav {
            gap: 0;
        }

        .navbar-nav .nav-link {
            font-size: 13px;
            padding: 6px 9px !important;
        }

        .nav-login-btn {
            padding: 6px 12px !important;
        }
    }
</style>


<div class="container d-flex justify-content-center navbar-wrap">

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="collapse navbar-collapse show">

            <ul class="navbar-nav mx-auto">

                <!-- Logo -->
                <li class="nav-item">

                    <div class="logo-plate">

                        <img
                            src="{% static 'admissionapp/SipherWebLogo.png' %}"
                            alt="Sipher Web"
                            class="logo"
                        >

                    </div>

                </li>


                <!-- Home -->
                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="{% url 'home' %}"
                    >
                        Home
                    </a>

                </li>


                <!-- About -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#aboutus"
                    >
                        About
                    </a>

                </li>


                <!-- Courses -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'courses' %}"
                    >
                        Courses
                    </a>

                </li>


                <!-- Enquiry -->
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'enquiry' %}"
                    >
                        Enquiry
                    </a>

                </li>


                <!-- Login -->
                <li class="nav-item">

                    <a
                        class="nav-link nav-login-btn"
                        href="{% url 'studentlogin' %}"
                    >
                        Login
                        <i class="fa-solid fa-circle-user"></i>
                    </a>

                </li>

            </ul>

        </div>

    </nav>

</div>
